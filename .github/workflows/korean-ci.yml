name: Korean localization CI
on:
  push:
    branches: [main, korean-localization]
    paths-ignore: ['localization/**', '**.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: korean-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Export source snapshot
        run: git archive --format=zip --output=source-audit.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-audit
          path: source-audit.zip
          retention-days: 3
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Remove workstation proxy
        run: sed -i '/^systemProp\..*[Pp]roxy/d' gradle.properties
      - name: Build baseline
        run: bash gradlew --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports
            build/reports
          if-no-files-found: ignore
