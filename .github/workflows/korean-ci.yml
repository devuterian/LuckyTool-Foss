name: Korean localization CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Prepare isolated CI signing and remove workstation proxy
        shell: bash
        run: |
          sed -i '/^systemProp\..*[Pp]roxy/d' gradle.properties
          mkdir -p keystore
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -alias ci -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=CI Build'
          printf 'storeFile=%s\nkeyAlias=ci\nkeyPassword=android\nstorePassword=android\n' "$RUNNER_TEMP/ci.jks" > keystore/keystore.properties
      - name: Build baseline
        run: bash gradlew --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports
            build/reports
          if-no-files-found: ignore
