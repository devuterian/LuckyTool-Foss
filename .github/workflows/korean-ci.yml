name: Korean localization CI
on:
  push:
    branches: [main, korean-localization]
    paths-ignore: ['localization/**', '**.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: korean-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Integrate and validate Korean sources
        shell: bash
        run: |
          if [ -f localization/integrate_runtime.py ]; then
            python3 localization/integrate_runtime.py
            rm localization/integrate_runtime.py
          fi
          rm -f localization/runtime.patch.zlib.b64
          python3 localization/generate.py
          python3 localization/generate.py --check
      - name: Commit generated source files
        if: github.event_name == 'push' && github.ref == 'refs/heads/korean-localization'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app gradle.properties localization
          if ! git diff --cached --quiet; then
            git commit -m 'l10n(ko): integrate validated Korean resources and runtime UI'
            git push origin HEAD:korean-localization
          fi
      - name: Export integrated source snapshot
        run: git archive --format=zip --output=source-audit.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-audit
          path: source-audit.zip
          retention-days: 7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Install verified current Android command-line tools
        shell: bash
        run: |
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  '"$RUNNER_TEMP/android-tools.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/android-cli"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-cli"
          echo "$RUNNER_TEMP/android-cli/cmdline-tools/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install compile SDK
        shell: bash
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --channel=3 --list > "$RUNNER_TEMP/sdk-list.txt"
          grep -E 'platforms;android-(36|37|Cinnamon)|build-tools;(36|37)' "$RUNNER_TEMP/sdk-list.txt" || true
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          set -o pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" --channel=3 'platforms;android-37' 'build-tools;36.0.0'
      - name: Build release APK
        shell: bash
        run: |
          if bash gradlew --no-daemon --no-configuration-cache --console=plain :app:assembleRelease > build.log 2>&1; then
            tail -n 35 build.log
          else
            tail -n 130 build.log
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-results
          path: |
            build.log
            app/build/outputs/apk/release/*.apk
            app/build/reports
            build/reports
          if-no-files-found: ignore
